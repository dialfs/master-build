# DEI Chatbot — satu domain untuk banyak klien berbasis path (dibuat add-client.sh)
#   https://__HOST__/<slug>/  ->  /var/www/<slug>
# Tiap klien menambah satu berkas di /etc/nginx/dei-paths/__HOST__/<slug>.conf
server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;
    root /var/www/_host/__HOST__;
    index index.html;
    client_max_body_size 25m;

    include /etc/nginx/dei-paths/__HOST__/*.conf;

    location / { try_files $uri $uri/ =404; }
    location ~ /\.(?!well-known) { deny all; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
