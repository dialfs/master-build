# DEI Chatbot — vhost klien __SLUG__ (dibuat add-client.sh)
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    root /var/www/__SLUG__;
    index index.php index.html;
    client_max_body_size 25m;

    # Data klien tidak pernah boleh diakses dari web (settings, server.php, log, .locks)
    location ^~ /data/ { deny all; return 403; }
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(secret|bak[^/]*)$ { deny all; }

    # Pretty URL (padanan .htaccess root)
    location = /          { rewrite ^ /dashboard/chatbot-ai/login.html last; }
    location ~ ^/login/?$ { rewrite ^ /dashboard/chatbot-ai/login.html last; }
    location ~ ^/(admin|dashboard)/?$ { rewrite ^ /dashboard/chatbot-ai/index.html last; }
    location = /index.html { rewrite ^ /dashboard/chatbot-ai/index.html last; }
    location = /login.html { rewrite ^ /dashboard/chatbot-ai/login.html last; }

    # File aplikasi dashboard: selalu revalidasi (padanan .htaccess dashboard)
    location ^~ /dashboard/chatbot-ai/ {
        location ~* \.(html|js|css)$ { add_header Cache-Control "no-cache, must-revalidate"; }
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/dei-__SLUG__.sock;
        fastcgi_read_timeout 120s;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
