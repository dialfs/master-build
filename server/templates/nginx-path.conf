# DEI Chatbot — klien __SLUG__ di https://__HOST__/__SLUG__/ (dibuat add-client.sh)
# Kode di /var/www/__SLUG__. Dashboard & API menghitung base path sendiri dari URL.
location = /__SLUG__ { return 301 /__SLUG__/; }

location ^~ /__SLUG__/ {
    root /var/www;

    # Data klien tidak pernah boleh diakses dari web (settings, server.php, log, .locks)
    location ^~ /__SLUG__/data/ { deny all; return 403; }
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(secret|bak[^/]*|sh)$ { deny all; }

    # Alamat pendek -> halaman asli (redirect, supaya path relatif ikon/logo tetap benar)
    location = /__SLUG__/ { return 302 /__SLUG__/dashboard/chatbot-ai/login.html; }
    location ~ ^/__SLUG__/login(\.html)?/?$ { return 302 /__SLUG__/dashboard/chatbot-ai/login.html; }
    location ~ ^/__SLUG__/(admin|dashboard|index\.html)/?$ { return 302 /__SLUG__/dashboard/chatbot-ai/index.html; }

    # File aplikasi dashboard: selalu revalidasi
    location ~* ^/__SLUG__/dashboard/chatbot-ai/.*\.(html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/dei-__SLUG__.sock;
        fastcgi_read_timeout 120s;
    }
}
