; DEI Chatbot — pool PHP-FPM klien __SLUG__ (user sendiri = isolasi antar klien)
[dei-__SLUG__]
user = dei-__SLUG__
group = dei-__SLUG__
listen = /run/php/dei-__SLUG__.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
; Web hanya menerima webhook & melayani dashboard — AI dipanggil worker, jadi pool kecil cukup.
pm = dynamic
pm.max_children = 24
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000
request_terminate_timeout = 150s
php_admin_value[error_log] = /var/log/dei/__SLUG__-php.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 25M
php_admin_value[post_max_size] = 25M
php_admin_value[date.timezone] = Asia/Jakarta
