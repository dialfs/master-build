; DEI Chatbot — worker antrean WA klien __SLUG__ (dibuat add-client.sh)
; Tiap worker berhenti sendiri setelah 500 job / 1 jam lalu dijalankan ulang (memori segar).
[program:dei-__SLUG__-worker]
command=/usr/bin/php /var/www/__SLUG__/api/index.php action=wa_worker slot=%(process_num)s
process_name=%(program_name)s_%(process_num)02d
numprocs=__WORKERS__
directory=/var/www/__SLUG__
user=dei-__SLUG__
autostart=true
autorestart=true
startsecs=3
startretries=100
stopwaitsecs=20
stdout_logfile=/var/log/dei/__SLUG__-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true
